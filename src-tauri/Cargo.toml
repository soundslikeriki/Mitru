[package]
name = "mitru"
version = "0.9.6-beta"
description = "Mitru - local-first estimating and quantity surveying app for builders."
authors = ["Mitru"]
edition = "2021"

[lib]
name = "mitru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
